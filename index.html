<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<meta name="theme-color" content="#0f0d14">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Vesper">
<meta name="theme-color" content="#0f0d14">
<title>Vesper — Peptide Log</title>
<style>
:root{
  --bg:#0f0d14; --bg2:#17141f; --card:#1d1927; --card2:#252033; --line:#332c44;
  --text:#ece6f5; --muted:#9a90ad; --amber:#f5a524; --amber2:#ffcf70; --amberdim:rgba(245,165,36,.14);
  --green:#5fd39a; --greendim:rgba(95,211,154,.14); --blue:#8fa8ff; --bluedim:rgba(143,168,255,.14);
  --grey:#a59fb3; --greydim:rgba(165,159,179,.14); --red:#ff6b6b; --reddim:rgba(255,107,107,.14);
  --r:14px;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font:15px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Inter,Helvetica,Arial,sans-serif;-webkit-text-size-adjust:100%}
body{background:radial-gradient(1200px 500px at 80% -200px,rgba(245,165,36,.10),transparent 60%),var(--bg);min-height:100vh}
a{color:var(--amber2)}
header{position:sticky;top:0;z-index:20;background:rgba(15,13,20,.88);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.hwrap{max-width:900px;margin:0 auto;padding:12px 16px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:9px;text-decoration:none;color:var(--text);font-weight:700;letter-spacing:.06em;font-size:20px}
.brand .moon{width:22px;height:22px;border-radius:50%;box-shadow:inset -6px -3px 0 0 var(--amber);transform:rotate(-20deg)}
.brand small{font-weight:500;letter-spacing:0;color:var(--muted);font-size:12px}
.spacer{flex:1}
.seg{display:inline-flex;background:var(--bg2);border:1px solid var(--line);border-radius:999px;padding:3px}
.seg button{border:0;background:transparent;color:var(--muted);padding:6px 14px;border-radius:999px;font:inherit;font-size:14px;cursor:pointer}
.seg button.on{background:var(--amber);color:#1a1205;font-weight:600}
nav.tabs{max-width:900px;margin:0 auto;padding:0 16px 10px;display:flex;gap:6px;overflow-x:auto}
nav.tabs a{color:var(--muted);text-decoration:none;padding:6px 12px;border-radius:999px;font-size:14px;white-space:nowrap;border:1px solid transparent}
nav.tabs a.on{color:var(--amber2);border-color:var(--line);background:var(--card)}
main{max-width:900px;margin:0 auto;padding:18px 16px 80px}
h1{font-size:22px;margin:0 0 4px} h2{font-size:17px;margin:0 0 10px} h3{font-size:15px;margin:0 0 8px}
.sub{color:var(--muted);font-size:13px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.between{justify-content:space-between}
.btn{appearance:none;border:1px solid var(--line);background:var(--card2);color:var(--text);padding:9px 14px;border-radius:10px;font:inherit;font-size:14px;cursor:pointer;display:inline-flex;align-items:center;gap:6px;text-decoration:none}
.btn:hover{border-color:#4a4060}
.btn.primary{background:var(--amber);border-color:var(--amber);color:#1a1205;font-weight:600}
.btn.primary:hover{background:var(--amber2)}
.btn.danger{color:var(--red);border-color:rgba(255,107,107,.35);background:transparent}
.btn.ghost{background:transparent}
.btn.sm{padding:5px 10px;font-size:13px;border-radius:8px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.stack>*+*{margin-top:14px}
.list{display:grid;gap:10px;margin-top:14px}
.pep{display:flex;align-items:center;gap:14px;background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;text-decoration:none;color:var(--text);transition:border-color .15s,transform .15s}
.pep:hover{border-color:rgba(245,165,36,.5);transform:translateY(-1px)}
.pep .dot{width:38px;height:38px;border-radius:10px;background:var(--amberdim);color:var(--amber2);display:grid;place-items:center;font-weight:700;flex:none}
.pep .info{flex:1;min-width:0}
.pep .name{font-weight:600;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pep .meta{color:var(--muted);font-size:13px}
.pep .stats{text-align:right;font-size:13px;color:var(--muted);flex:none}
.pep .stats b{color:var(--text);font-size:15px}
.badge{display:inline-block;font-size:11px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;padding:3px 8px;border-radius:999px;vertical-align:middle}
.b-active{background:var(--greendim);color:var(--green)}
.b-paused{background:var(--amberdim);color:var(--amber2)}
.b-finished{background:var(--greydim);color:var(--grey)}
.b-sample{background:var(--bluedim);color:var(--blue)}
.empty{text-align:center;padding:48px 16px;color:var(--muted);border:1px dashed var(--line);border-radius:var(--r);margin-top:14px}
.empty .big{font-size:40px;margin-bottom:6px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
@media (max-width:640px){.grid2,.grid3{grid-template-columns:1fr}.pep .stats{display:none}.hwrap{gap:8px}}
label{display:block;font-size:12px;color:var(--muted);margin-bottom:4px;font-weight:500;letter-spacing:.02em}
input,select,textarea{width:100%;background:var(--bg2);color:var(--text);border:1px solid var(--line);border-radius:10px;padding:9px 11px;font:inherit;font-size:15px;outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--amber);box-shadow:0 0 0 3px var(--amberdim)}
textarea{min-height:90px;resize:vertical}
input[type=date],input[type=time]{color-scheme:dark}
.field{margin-bottom:12px}
.kv{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}
.kv div{background:var(--bg2);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.kv span{display:block;font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.kv b{font-weight:600}
.log{list-style:none;margin:0;padding:0}
.log li{display:flex;gap:12px;align-items:flex-start;padding:12px 0;border-top:1px solid var(--line)}
.log li:first-child{border-top:0}
.log .when{flex:none;width:92px;font-size:13px;color:var(--muted)}
.log .when b{display:block;color:var(--amber2);font-size:14px}
.log .what{flex:1;min-width:0}
.log .what .amt{font-weight:600;font-size:15px}
.log .what .note{color:var(--muted);font-size:13px;white-space:pre-wrap}
.out{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin-top:6px}
.out div{background:var(--amberdim);border:1px solid rgba(245,165,36,.3);border-radius:10px;padding:10px 12px}
.out span{display:block;font-size:11px;color:var(--amber2);text-transform:uppercase;letter-spacing:.05em}
.out b{font-size:18px}
.hint{font-size:12px;color:var(--muted);margin-top:6px}
.callout{font-size:13px;color:var(--muted);background:var(--bg2);border:1px solid var(--line);border-left:3px solid var(--amber);border-radius:8px;padding:8px 10px}
dialog{background:var(--card);color:var(--text);border:1px solid var(--line);border-radius:16px;padding:0;width:min(560px,94vw);max-height:90vh}
dialog::backdrop{background:rgba(5,4,8,.7)}
dialog form{padding:18px}
dialog .dh{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.x{background:none;border:0;color:var(--muted);font-size:22px;cursor:pointer;line-height:1}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%) translateY(20px);background:var(--card2);border:1px solid var(--line);color:var(--text);padding:10px 16px;border-radius:10px;opacity:0;transition:.2s;pointer-events:none;z-index:50;font-size:14px}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.back{color:var(--muted);text-decoration:none;font-size:14px;display:inline-block;margin-bottom:10px}
.back:hover{color:var(--amber2)}
.tools{display:flex;gap:8px;flex-wrap:wrap}
svg.chart{width:100%;height:180px;display:block}
.muted{color:var(--muted)}
.thumb{width:44px;height:44px;border-radius:10px;object-fit:cover;flex:none;border:1px solid var(--line);background:var(--bg2)}
.pep .dot{width:44px;height:44px}
.dot.vial{font-size:20px}
.b-peptide{background:rgba(196,152,255,.14);color:#c9a6ff}
.b-medication{background:rgba(110,200,230,.14);color:#7fd0ea}
.due{display:inline-block;font-size:12px;font-weight:600;padding:2px 8px;border-radius:6px;margin-top:4px}
.due-ok{background:var(--greydim);color:var(--text)}
.due-muted{background:var(--greydim);color:var(--muted)}
.due-amber{background:var(--amberdim);color:var(--amber2);border:1px solid rgba(245,165,36,.45)}
.due-red{background:var(--reddim);color:var(--red);border:1px solid rgba(255,107,107,.45)}
.filters{display:flex;gap:6px;margin-top:14px;flex-wrap:wrap}
.filters button{border:1px solid var(--line);background:transparent;color:var(--muted);padding:6px 12px;border-radius:999px;font:inherit;font-size:13px;cursor:pointer}
.filters button.on{background:var(--card2);color:var(--amber2);border-color:rgba(245,165,36,.5)}
.filters button span{opacity:.7;margin-left:4px}
.photo-main{display:block;width:100%;max-height:440px;object-fit:contain;border-radius:12px;background:var(--bg2);border:1px solid var(--line)}
.photo-empty{display:grid;place-items:center;height:140px;border:1px dashed var(--line);border-radius:12px;color:var(--muted);background:var(--bg2)}
.gallery{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px}
.gcard{background:var(--bg2);border:1px solid var(--line);border-radius:12px;overflow:hidden;display:flex;flex-direction:column}
.gcard.sel{border-color:var(--amber);box-shadow:0 0 0 2px var(--amberdim)}
.gcard img,.gcard .noimg{width:100%;aspect-ratio:3/4;object-fit:cover;display:block;background:#120f18}
.gcard .noimg{display:grid;place-items:center;color:var(--muted);font-size:13px}
.gcard .gb{padding:10px 12px;flex:1;display:flex;flex-direction:column;gap:4px;font-size:13px}
.gcard .gd{color:var(--amber2);font-weight:600;font-size:14px}
.gcard .gm{font-weight:600}
.gcard .gn{color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.gcard .ga{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-top:auto;padding-top:6px}
.delta{font-size:12px;color:var(--muted)}
.delta .dn{color:var(--green)} .delta .up{color:var(--amber2)}
.chk{display:inline-flex;align-items:center;gap:5px;font-size:12px;color:var(--muted);cursor:pointer;margin-right:auto}
.chk input{width:auto;accent-color:var(--amber)}
.cmp{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.cmp img,.cmp .noimg{width:100%;max-height:520px;object-fit:contain;border-radius:12px;background:var(--bg2);border:1px solid var(--line);display:block}
.cmp .noimg{height:240px;display:grid;place-items:center;color:var(--muted)}
.cmp h3{margin:8px 0 2px;color:var(--amber2)}
@media (max-width:640px){.cmp{grid-template-columns:1fr}}
.preview{max-width:160px;max-height:160px;border-radius:10px;border:1px solid var(--line);display:block;margin-top:8px}
.filebtn{position:relative;overflow:hidden}
.sticky-bar{position:sticky;bottom:12px;z-index:5;margin-top:12px}
.mobile-only{display:none}
@media (max-width:640px){.mobile-only{display:inline}}
footer{max-width:900px;margin:0 auto;padding:0 16px 30px;color:var(--muted);font-size:12px}
</style>
<style id="pwa-safe-area">
header{padding-top:env(safe-area-inset-top);padding-left:env(safe-area-inset-left);padding-right:env(safe-area-inset-right)}
body{padding-bottom:env(safe-area-inset-bottom)}
.toast{bottom:calc(22px + env(safe-area-inset-bottom))}
</style>

<body>
<header>
  <div class="hwrap">
    <a class="brand" href="#/"><span class="moon"></span>Vesper <small>peptide &amp; medication log</small></a>
    <div class="spacer"></div>
    <div class="seg" id="profileSeg" role="tablist" aria-label="Profile"></div>
  </div>
  <nav class="tabs" id="tabs">
    <a href="#/" data-tab="home">Log</a>
    <a href="#/progress" data-tab="progress">Progress</a>
    <a href="#/calc" data-tab="calc">Calculator</a>
    <a href="#/data" data-tab="data">Backup</a>
  </nav>
</header>
<main id="app"></main>
<footer>Data is stored only in this browser (localStorage), separately for each profile. Use Backup → Export to keep a copy. Vesper is a personal log, not medical advice.</footer>

<dialog id="pepDialog">
  <form method="dialog" id="pepForm" autocomplete="off">
    <div class="dh"><h2 id="pepDialogTitle">Add entry</h2><button type="button" class="x" data-close>&times;</button></div>
    <div class="grid2">
      <div class="field"><label for="pf-type">Type</label><select id="pf-type" name="type"><option value="peptide">Peptide</option><option value="medication">Medication</option></select></div>
      <div class="field"><label for="pf-status">Status</label><select id="pf-status" name="status"><option value="active">Active</option><option value="paused">Paused</option><option value="finished">Finished</option></select></div>
    </div>
    <div class="field"><label for="pf-name">Name *</label><input id="pf-name" name="name" required maxlength="80" placeholder="e.g. BPC-157"></div>
    <div class="grid2">
      <div class="field"><label for="pf-vendor">Vendor</label><input id="pf-vendor" name="vendor" maxlength="80"></div>
      <div class="field"><label for="pf-interval" id="pf-intervalLabel">Dosing interval (days, optional)</label><input id="pf-interval" name="intervalDays" type="number" step="1" min="1" inputmode="numeric" placeholder="e.g. 5"></div>
      <div class="field"><label for="pf-vial">Vial size (mg)</label><input id="pf-vial" name="vialMg" type="number" step="any" min="0" inputmode="decimal"></div>
      <div class="field"><label for="pf-start">Start date</label><input id="pf-start" name="startDate" type="date"></div>
    </div>
    <div class="field"><label for="pf-recon">Reconstitution info (optional)</label><textarea id="pf-recon" name="reconInfo" placeholder="e.g. Mix with 2 mL bacteriostatic water, refrigerate"></textarea></div>
    <div class="row between"><span class="hint" id="pf-err" style="color:var(--red)"></span><div class="row"><button type="button" class="btn ghost" data-close>Cancel</button><button type="submit" class="btn primary" id="pepSubmit">Save</button></div></div>
  </form>
</dialog>

<div class="toast" id="toast"></div>
<input type="file" id="importFile" accept="application/json,.json" hidden>
<input type="file" id="photoInput" accept="image/*" capture="environment" hidden>

<!-- Pure date / due-date helpers (no DOM). Also loaded by tests/due-date.test.js. -->
<script id="vesper-core">
(function(root){
  'use strict';
  var MONTHS = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  var WDAYS = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
  function pad(n){ return (n < 10 ? '0' : '') + n; }
  // Calendar dates are handled as Y-M-D triples mapped to UTC midnight, so day arithmetic never crosses a DST shift.
  function parseISO(iso){ var m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(iso || ''); return m ? Date.UTC(+m[1], +m[2] - 1, +m[3]) : null; }
  function toISO(t){ var d = new Date(t); return d.getUTCFullYear() + '-' + pad(d.getUTCMonth() + 1) + '-' + pad(d.getUTCDate()); }
  function localTodayISO(now){ now = now || new Date(); return now.getFullYear() + '-' + pad(now.getMonth() + 1) + '-' + pad(now.getDate()); }
  function addDays(iso, n){ var t = parseISO(iso); return t == null ? null : toISO(t + n * 86400000); }
  function diffDays(a, b){ var ta = parseISO(a), tb = parseISO(b); return ta == null || tb == null ? null : Math.round((tb - ta) / 86400000); } // b - a
  function fmtShort(iso){ var t = parseISO(iso); if (t == null) return iso || ''; var d = new Date(t); return WDAYS[d.getUTCDay()] + ', ' + MONTHS[d.getUTCMonth()] + ' ' + d.getUTCDate(); }
  function plural(n, w){ return n + ' ' + w + (n === 1 ? '' : 's'); }
  function latestDate(dates){ var best = null; (dates || []).forEach(function(d){ if (parseISO(d) != null && (best == null || d > best)) best = d; }); return best; }
  /* dueStatus(lastDoseISO, intervalDays, todayISO)
     actual due = last + interval; flagged DUE from one day before that. */
  function dueStatus(lastISO, interval, todayISO){
    interval = parseInt(interval, 10);
    if (!interval || interval < 1) return {kind: 'none', label: '', cls: ''};
    if (!lastISO) return {kind: 'nodoses', label: 'No doses yet', cls: 'muted'};
    var due = addDays(lastISO, interval);
    var left = diffDays(todayISO, due);
    if (left >= 2) return {kind: 'upcoming', label: 'Next dose in ' + plural(left, 'day') + ' (due ' + fmtShort(due) + ')', cls: 'ok', due: due, daysLeft: left};
    if (left === 1) return {kind: 'duesoon', label: 'Due now (scheduled tomorrow, ' + fmtShort(due) + ')', cls: 'amber', due: due, daysLeft: left};
    if (left === 0) return {kind: 'today', label: 'Due today', cls: 'amber', due: due, daysLeft: 0};
    return {kind: 'overdue', label: 'Overdue by ' + plural(-left, 'day'), cls: 'red', due: due, daysLeft: left};
  }
  var api = {parseISO: parseISO, toISO: toISO, localTodayISO: localTodayISO, addDays: addDays, diffDays: diffDays, fmtShort: fmtShort, latestDate: latestDate, dueStatus: dueStatus};
  if (typeof module !== 'undefined' && module.exports) module.exports = api;
  root.VesperCore = api;
})(typeof window !== 'undefined' ? window : this);
</script>
<script>
(function(){
'use strict';
var C = window.VesperCore;

/* ---------- constants ---------- */
var PROFILES = [{id:'rodney', name:'Rodney'}, {id:'caroline', name:'Caroline'}];
var KEY_PREFIX = 'vesper:profile:';
var KEY_ACTIVE = 'vesper:active';
var KEY_FILTER = 'vesper:filter';
var KEY_SEED_MED = 'vesper:seed:rodney:sample-medication-v1';
var IMG_PREFIX = 'vesper:img:';          // vesper:img:<profile>:<imageId> -> {"full": dataURL, "thumb": dataURL}
var UNITS = ['mg','mcg','IU','mL'];
var SITES = ['Abdomen – left','Abdomen – right','Thigh – left','Thigh – right','Glute – left','Glute – right','Deltoid – left','Deltoid – right','Upper arm (back) – left','Upper arm (back) – right','Love handle – left','Love handle – right','Other'];
var TIMES = ['morning','afternoon','evening','night'];
var SAMPLE_NOTE = 'Sample entry — delete anytime';
var STORAGE_FULL_MSG = 'Storage full — this browser has no room left. Remove some photos or export a backup and delete old entries, then try again.';

/* ---------- utils ---------- */
function $(s, r){ return (r||document).querySelector(s); }
function $all(s, r){ return Array.prototype.slice.call((r||document).querySelectorAll(s)); }
function esc(s){ return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2, 8); }
function pad(n){ return (n < 10 ? '0' : '') + n; }
function todayISO(){ return C.localTodayISO(); }
function daysAgo(n){ return C.addDays(todayISO(), -n); }
function num(v){ if (v === '' || v == null) return null; var n = parseFloat(v); return isFinite(n) ? n : null; }
function int(v){ var n = parseInt(v, 10); return isFinite(n) && n > 0 ? n : null; }
function fmtNum(n, max){ if (n == null || !isFinite(n)) return '—'; return Number(n).toLocaleString(undefined, {maximumFractionDigits: max == null ? 3 : max}); }
function signed(n, max){ return (n > 0 ? '+' : n < 0 ? '−' : '±') + fmtNum(Math.abs(n), max); }
function localDate(iso){ var p = (iso || '').split('-'); return p.length === 3 ? new Date(+p[0], +p[1]-1, +p[2]) : null; }
function fmtDate(iso){ var d = localDate(iso); return d ? d.toLocaleDateString(undefined, {month:'short', day:'numeric', year:'numeric'}) : (iso || '—'); }
function fmtDateParts(iso){ var d = localDate(iso); if (!d) return {a: iso || '—', b: ''}; return {a: d.toLocaleDateString(undefined, {month:'short', day:'numeric'}), b: d.toLocaleDateString(undefined, {weekday:'short', year:'numeric'})}; }
function fmtTime(t){ var m = /^(\d{1,2}):(\d{2})/.exec(t || ''); if (!m) return t || ''; var h = +m[1], ap = h >= 12 ? 'PM' : 'AM'; h = h % 12 || 12; return h + ':' + m[2] + ' ' + ap; }
var toastTimer;
function toast(msg, ms){ var t = $('#toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(toastTimer); toastTimer = setTimeout(function(){ t.classList.remove('show'); }, ms || 2200); }
function isQuota(e){ return e && (e.name === 'QuotaExceededError' || e.name === 'NS_ERROR_DOM_QUOTA_REACHED' || e.code === 22 || e.code === 1014); }

/* ---------- storage ---------- */
function storageGet(k){ try { return localStorage.getItem(k); } catch(e){ return null; } }
function storageSet(k, v){
  try { localStorage.setItem(k, v); return true; }
  catch(e){ if (isQuota(e)) alert(STORAGE_FULL_MSG); else toast('Could not save: storage unavailable'); return false; }
}
function storageRemove(k){ try { localStorage.removeItem(k); } catch(e){} }
function imgKey(profile, id){ return IMG_PREFIX + profile + ':' + id; }
function getImage(id, profile){ if (!id) return null; var raw = storageGet(imgKey(profile || state.profile, id)); if (!raw) return null; try { return JSON.parse(raw); } catch(e){ return null; } }
function putImage(obj, profile){ var id = 'img_' + uid(); return storageSet(imgKey(profile || state.profile, id), JSON.stringify(obj)) ? id : null; }
function removeImage(id, profile){ if (id) storageRemove(imgKey(profile || state.profile, id)); }
function profileImageIds(profile){
  var pre = IMG_PREFIX + profile + ':', out = [];
  try { for (var i = 0; i < localStorage.length; i++) { var k = localStorage.key(i); if (k && k.indexOf(pre) === 0) out.push(k.slice(pre.length)); } } catch(e){}
  return out;
}
function referencedImageIds(data){
  var ids = {};
  data.peptides.forEach(function(p){ if (p.photoId) ids[p.photoId] = 1; });
  data.progress.forEach(function(e){ if (e.photoId) ids[e.photoId] = 1; });
  return ids;
}
function gcImages(profile, data){ var ref = referencedImageIds(data); profileImageIds(profile).forEach(function(id){ if (!ref[id]) removeImage(id, profile); }); }

/* Downscale an image File via canvas -> {full: JPEG <=800px, thumb: 96px square JPEG} */
function processImage(file){
  return new Promise(function(resolve, reject){
    if (!file || !/^image\//.test(file.type || 'image/')) { reject(new Error('Please choose an image file.')); return; }
    var url = URL.createObjectURL(file), img = new Image();
    img.onload = function(){
      try {
        var w = img.naturalWidth, h = img.naturalHeight, max = 800, sc = Math.min(1, max / Math.max(w, h));
        var cv = document.createElement('canvas'); cv.width = Math.max(1, Math.round(w * sc)); cv.height = Math.max(1, Math.round(h * sc));
        var cx = cv.getContext('2d'); cx.fillStyle = '#111'; cx.fillRect(0, 0, cv.width, cv.height); cx.drawImage(img, 0, 0, cv.width, cv.height);
        var full = cv.toDataURL('image/jpeg', 0.8);
        var T = 96, tv = document.createElement('canvas'); tv.width = T; tv.height = T;
        var s = Math.min(w, h), tx = tv.getContext('2d'); tx.fillStyle = '#111'; tx.fillRect(0, 0, T, T);
        tx.drawImage(img, (w - s) / 2, (h - s) / 2, s, s, 0, 0, T, T);
        var thumb = tv.toDataURL('image/jpeg', 0.8);
        URL.revokeObjectURL(url); resolve({full: full, thumb: thumb});
      } catch(e){ URL.revokeObjectURL(url); reject(e); }
    };
    img.onerror = function(){ URL.revokeObjectURL(url); reject(new Error('Could not read that image.')); };
    img.src = url;
  });
}

/* ---------- data model ---------- */
function emptyProfileData(){ return {version: 2, peptides: [], progress: []}; }
function normalize(data){
  if (!data || typeof data !== 'object') data = {};
  var out = emptyProfileData();
  out.peptides = (Array.isArray(data.peptides) ? data.peptides : []).filter(function(p){ return p && p.name; }).map(function(p){
    return {
      id: p.id || uid(), type: p.type === 'medication' ? 'medication' : 'peptide', name: String(p.name), vendor: p.vendor || '',
      status: ['active','paused','finished'].indexOf(p.status) >= 0 ? p.status : 'active',
      intervalDays: int(p.intervalDays), vialMg: num(p.vialMg), startDate: p.startDate || '', reconInfo: p.reconInfo || '',
      notes: p.notes || '', sample: !!p.sample, photoId: p.photoId || null, createdAt: p.createdAt || Date.now(),
      doses: (Array.isArray(p.doses) ? p.doses : []).map(function(d){
        return {id: d.id || uid(), date: d.date || '', amount: num(d.amount), unit: UNITS.indexOf(d.unit) >= 0 ? d.unit : 'mg',
          site: d.site || '', siteOther: d.siteOther || '', tod: d.tod || '', time: d.time || '', note: d.note || '', createdAt: d.createdAt || Date.now()};
      }),
      mixes: (Array.isArray(p.mixes) ? p.mixes : []).map(function(m){
        return {id: m.id || uid(), date: m.date || '', vialMg: num(m.vialMg), waterMl: num(m.waterMl), concMgPerMl: num(m.concMgPerMl), storage: m.storage || '', createdAt: m.createdAt || Date.now()};
      })
    };
  });
  out.progress = (Array.isArray(data.progress) ? data.progress : []).filter(function(e){ return e && e.date; }).map(function(e){
    return {id: e.id || uid(), date: e.date, photoId: e.photoId || null, weight: num(e.weight), unit: e.unit === 'kg' ? 'kg' : 'lb', bodyFat: num(e.bodyFat), waist: num(e.waist), note: e.note || '', createdAt: e.createdAt || Date.now()};
  });
  return out;
}
function loadProfile(id){ var raw = storageGet(KEY_PREFIX + id); if (!raw) return null; try { return normalize(JSON.parse(raw)); } catch(e){ return emptyProfileData(); } }
function saveProfile(){ return storageSet(KEY_PREFIX + state.profile, JSON.stringify(state.data)); }

function sampleDose(daysBack, amount, unit, site, tod){ return {id: uid(), date: daysAgo(daysBack), amount: amount, unit: unit, site: site, siteOther: '', tod: tod, time: '', note: SAMPLE_NOTE, createdAt: Date.now() - daysBack * 864e5}; }
function sampleMix(daysBack, vial, water, storage){ return {id: uid(), date: daysAgo(daysBack), vialMg: vial, waterMl: water, concMgPerMl: Math.round(vial / water * 1000) / 1000, storage: storage, createdAt: Date.now() - daysBack * 864e5}; }

/* ---------- state ---------- */
var state = {profile: 'rodney', data: emptyProfileData(), filter: 'all', compareSel: [], editingProgressId: null};

function initProfiles(){
  // First run: seed Rodney (only if he has never had saved data). Caroline starts empty.
  if (storageGet(KEY_PREFIX + 'rodney') == null) {
    storageSet(KEY_PREFIX + 'rodney', JSON.stringify(sampleData()));
    storageSet(KEY_SEED_MED, '1');
  } else if (storageGet(KEY_SEED_MED) == null) {
    // One-time migration for data saved by the earlier version: add the sample medication.
    var r = loadProfile('rodney') || emptyProfileData();
    if (!r.peptides.some(function(p){ return p.sample && p.type === 'medication'; })) r.peptides.push(normalize({peptides: [sampleMedication()]}).peptides[0]);
    storageSet(KEY_PREFIX + 'rodney', JSON.stringify(r));
    storageSet(KEY_SEED_MED, '1');
  }
  if (storageGet(KEY_PREFIX + 'caroline') == null) storageSet(KEY_PREFIX + 'caroline', JSON.stringify(emptyProfileData()));
  var f = storageGet(KEY_FILTER); if (['all','peptide','medication'].indexOf(f) >= 0) state.filter = f;
  var active = storageGet(KEY_ACTIVE);
  if (!PROFILES.some(function(p){ return p.id === active; })) active = 'rodney';
  switchProfile(active, true);
}
function switchProfile(id, silent){
  state.profile = id;
  state.data = loadProfile(id) || emptyProfileData();
  state.compareSel = []; state.editingProgressId = null;
  storageSet(KEY_ACTIVE, id);
  renderProfileSeg();
  if (!silent) {
    toast('Switched to ' + profileName(id));
    if (/^#\/(p|compare)\//.test(location.hash)) { location.hash = /^#\/compare/.test(location.hash) ? '#/progress' : '#/'; return; }
    render();
  }
}
function profileName(id){ var p = PROFILES.filter(function(x){ return x.id === id; })[0]; return p ? p.name : id; }
function renderProfileSeg(){
  // Fixed two-button segmented toggle: [Rodney][Caroline]. No add/rename/delete.
  $('#profileSeg').innerHTML = PROFILES.map(function(p){
    return '<button type="button" role="tab" data-profile="' + p.id + '" aria-selected="' + (p.id === state.profile) + '" class="' + (p.id === state.profile ? 'on' : '') + '">' + esc(p.name) + '</button>';
  }).join('');
}
$('#profileSeg').addEventListener('click', function(e){
  var b = e.target.closest('[data-profile]'); if (!b) return;
  if (b.dataset.profile !== state.profile) switchProfile(b.dataset.profile);
});
window.addEventListener('storage', function(e){
  if (e.key === KEY_PREFIX + state.profile) { state.data = loadProfile(state.profile) || emptyProfileData(); render(); }
});

function getPep(id){ return state.data.peptides.filter(function(p){ return p.id === id; })[0]; }
function sortedDoses(p){ return p.doses.slice().sort(function(a, b){ return (b.date || '').localeCompare(a.date || '') || (b.time || '').localeCompare(a.time || '') || (b.createdAt - a.createdAt); }); }
function lastDose(p){ return sortedDoses(p)[0]; }
function latestMix(p){ return p.mixes.slice().sort(function(a, b){ return (b.date || '').localeCompare(a.date || '') || (b.createdAt - a.createdAt); })[0]; }
function statusBadge(s){ return '<span class="badge b-' + esc(s) + '">' + esc(s) + '</span>'; }
function typeBadge(t){ return '<span class="badge b-' + t + '">' + (t === 'medication' ? 'Medication' : 'Peptide') + '</span>'; }
function pepDue(p){
  if (p.status !== 'active') return {kind: 'none', label: '', cls: ''}; // paused / finished entries are not flagged
  return C.dueStatus(C.latestDate(p.doses.map(function(d){ return d.date; })), p.intervalDays, todayISO());
}
function dueChip(st){ return st && st.label ? '<span class="due due-' + st.cls + '" data-due="' + st.kind + '">' + esc(st.label) + '</span>' : ''; }
function thumbHTML(p){
  var img = getImage(p.photoId);
  if (img && img.thumb) return '<img class="thumb" src="' + img.thumb + '" alt="">';
  return '<div class="dot' + (p.type === 'medication' ? ' vial' : '') + '">' + (p.type === 'medication' ? '💊' : esc(p.name.trim().charAt(0).toUpperCase())) + '</div>';
}

/* ---------- router ---------- */
function route(){
  var h = location.hash || '#/', m;
  if ((m = /^#\/p\/([^/]+)$/.exec(h))) return {name: 'detail', id: decodeURIComponent(m[1]), tab: 'home'};
  if ((m = /^#\/compare\/([^/]+)\/([^/]+)$/.exec(h))) return {name: 'compare', a: decodeURIComponent(m[1]), b: decodeURIComponent(m[2]), tab: 'progress'};
  if (h === '#/calc') return {name: 'calc', tab: 'calc'};
  if (h === '#/progress') return {name: 'progress', tab: 'progress'};
  if (h === '#/data') return {name: 'data', tab: 'data'};
  return {name: 'home', tab: 'home'};
}
function render(){
  var r = route();
  $all('#tabs a').forEach(function(a){ a.classList.toggle('on', a.dataset.tab === r.tab); });
  var app = $('#app');
  if (r.name === 'detail') renderDetail(app, r.id);
  else if (r.name === 'compare') renderCompare(app, r.a, r.b);
  else if (r.name === 'calc') renderCalc(app);
  else if (r.name === 'progress') renderProgress(app);
  else if (r.name === 'data') renderData(app);
  else renderHome(app);
}
window.addEventListener('hashchange', function(){ render(); window.scrollTo(0, 0); });

/* ---------- home ---------- */
var DUE_RANK = {overdue: 0, today: 1, duesoon: 2, nodoses: 3, upcoming: 4, none: 5};
function renderHome(app){
  var all = state.data.peptides;
  var peps = all.filter(function(p){ return state.filter === 'all' || p.type === state.filter; });
  var order = {active: 0, paused: 1, finished: 2};
  var dues = {}; peps.forEach(function(p){ dues[p.id] = pepDue(p); });
  peps.sort(function(a, b){
    var la = lastDose(a), lb = lastDose(b);
    return (order[a.status] - order[b.status]) || (DUE_RANK[dues[a.id].kind] - DUE_RANK[dues[b.id].kind]) ||
      ((lb ? lb.date : '').localeCompare(la ? la.date : '')) || a.name.localeCompare(b.name);
  });
  var nPep = all.filter(function(p){ return p.type === 'peptide'; }).length, nMed = all.length - nPep;
  var html = '<div class="row between"><div><h1>' + esc(profileName(state.profile)) + '’s log</h1><div class="sub">' +
    nPep + ' peptide' + (nPep === 1 ? '' : 's') + ' · ' + nMed + ' medication' + (nMed === 1 ? '' : 's') + ' · ' + all.reduce(function(s, p){ return s + p.doses.length; }, 0) + ' doses logged</div></div>' +
    '<button class="btn primary" id="addPepBtn" type="button">+ Add entry</button></div>' +
    '<div class="filters" role="tablist" aria-label="Filter">' + [['all', 'All', all.length], ['peptide', 'Peptides', nPep], ['medication', 'Medications', nMed]].map(function(f){
      return '<button type="button" data-filter="' + f[0] + '" class="' + (state.filter === f[0] ? 'on' : '') + '">' + f[1] + '<span>' + f[2] + '</span></button>'; }).join('') + '</div>';
  if (!all.length) {
    html += '<div class="empty"><div class="big">🌙</div><div><b>Nothing logged yet</b></div><div>Add a peptide or medication to start logging doses.</div></div>';
  } else if (!peps.length) {
    html += '<div class="empty"><div><b>No ' + (state.filter === 'medication' ? 'medications' : 'peptides') + ' yet</b></div></div>';
  } else {
    html += '<div class="list">' + peps.map(function(p){
      var ld = lastDose(p);
      return '<a class="pep" href="#/p/' + encodeURIComponent(p.id) + '" data-pep="' + esc(p.id) + '">' + thumbHTML(p) +
        '<div class="info"><div class="name">' + esc(p.name) + '</div><div class="meta">' + typeBadge(p.type) + ' ' + statusBadge(p.status) + (p.sample ? ' <span class="badge b-sample">sample</span>' : '') +
        ' &nbsp;' + (p.vendor ? esc(p.vendor) : '<span class="muted">No vendor</span>') +
        '<span class="mobile-only"> · ' + p.doses.length + ' dose' + (p.doses.length === 1 ? '' : 's') + (ld ? ' · last ' + esc(fmtDate(ld.date)) : '') + '</span></div>' + dueChip(dues[p.id]) + '</div>' +
        '<div class="stats"><b>' + p.doses.length + '</b> dose' + (p.doses.length === 1 ? '' : 's') + '<br>' + (ld ? 'Last: ' + esc(fmtDate(ld.date)) : 'No doses yet') +
        (p.intervalDays ? '<br>Every ' + p.intervalDays + ' day' + (p.intervalDays === 1 ? '' : 's') : '') + '</div></a>';
    }).join('') + '</div>';
  }
  app.innerHTML = html;
  $('#addPepBtn').addEventListener('click', function(){ openPepDialog(null); });
  $all('[data-filter]', app).forEach(function(b){ b.addEventListener('click', function(){ state.filter = b.dataset.filter; storageSet(KEY_FILTER, state.filter); render(); }); });
}

/* ---------- add / edit dialog ---------- */
var pepDialog = $('#pepDialog'), pepForm = $('#pepForm'), editingPepId = null;
function syncTypeFields(){
  var med = pepForm.type.value === 'medication';
  pepForm.intervalDays.required = med;
  $('#pf-intervalLabel').textContent = med ? 'Dosing interval (days) *' : 'Dosing interval (days, optional)';
  pepForm.name.placeholder = med ? 'e.g. Medication name' : 'e.g. BPC-157';
}
pepForm.type.addEventListener('change', syncTypeFields);
function openPepDialog(p){
  editingPepId = p ? p.id : null;
  $('#pepDialogTitle').textContent = p ? 'Edit entry' : 'Add entry';
  $('#pf-err').textContent = '';
  pepForm.type.value = p ? p.type : (state.filter === 'medication' ? 'medication' : 'peptide');
  pepForm.name.value = p ? p.name : '';
  pepForm.vendor.value = p ? p.vendor : '';
  pepForm.status.value = p ? p.status : 'active';
  pepForm.intervalDays.value = p && p.intervalDays ? p.intervalDays : '';
  pepForm.vialMg.value = p && p.vialMg != null ? p.vialMg : '';
  pepForm.startDate.value = p ? p.startDate : todayISO();
  pepForm.reconInfo.value = p ? p.reconInfo : '';
  syncTypeFields();
  if (typeof pepDialog.showModal === 'function') pepDialog.showModal(); else pepDialog.setAttribute('open', '');
  setTimeout(function(){ pepForm.name.focus(); }, 30);
}
function closePepDialog(){ if (pepDialog.close) pepDialog.close(); else pepDialog.removeAttribute('open'); }
$all('[data-close]', pepDialog).forEach(function(b){ b.addEventListener('click', closePepDialog); });
pepForm.addEventListener('submit', function(e){
  e.preventDefault();
  var name = pepForm.name.value.trim(), type = pepForm.type.value, rawInt = pepForm.intervalDays.value.trim(), interval = null;
  if (!name) { pepForm.name.focus(); return; }
  if (rawInt !== '') {
    if (!/^\d+$/.test(rawInt) || +rawInt < 1) { $('#pf-err').textContent = 'Interval must be a whole number of days (1 or more).'; pepForm.intervalDays.focus(); return; }
    interval = +rawInt;
  }
  if (type === 'medication' && !interval) { $('#pf-err').textContent = 'Medications need a dosing interval in days.'; pepForm.intervalDays.focus(); return; }
  var vals = {type: type, name: name, vendor: pepForm.vendor.value.trim(), status: pepForm.status.value, intervalDays: interval, vialMg: num(pepForm.vialMg.value), startDate: pepForm.startDate.value, reconInfo: pepForm.reconInfo.value.trim()};
  if (editingPepId) {
    var p = getPep(editingPepId); if (p) Object.keys(vals).forEach(function(k){ p[k] = vals[k]; });
    saveProfile(); closePepDialog(); toast('Entry updated'); render();
  } else {
    var np = {id: uid(), notes: '', doses: [], mixes: [], sample: false, photoId: null, createdAt: Date.now()};
    Object.keys(vals).forEach(function(k){ np[k] = vals[k]; });
    state.data.peptides.push(np); saveProfile(); closePepDialog(); toast((type === 'medication' ? 'Medication' : 'Peptide') + ' added');
    location.hash = '#/p/' + encodeURIComponent(np.id);
  }
});

/* ---------- concentration math ---------- */
function calcDraw(concMgPerMl, dose, unit){
  if (!concMgPerMl || concMgPerMl <= 0 || dose == null || dose <= 0) return null;
  var doseMg = unit === 'mcg' ? dose / 1000 : unit === 'mg' ? dose : null;
  if (doseMg == null) return null;
  var ml = doseMg / concMgPerMl;
  return {ml: ml, units: ml * 100};
}

/* ---------- entry photo ---------- */
var photoTarget = null;
$('#photoInput').addEventListener('change', function(e){
  var file = e.target.files && e.target.files[0], p = photoTarget && getPep(photoTarget);
  e.target.value = '';
  if (!file || !p) return;
  processImage(file).then(function(obj){
    var id = putImage(obj); if (!id) return; // storageSet already showed the storage-full message
    var old = p.photoId; p.photoId = id;
    if (!saveProfile()) { p.photoId = old; removeImage(id); return; }
    removeImage(old); toast(old ? 'Photo changed' : 'Photo added'); render();
  }).catch(function(err){ alert(err.message || 'Could not process that image.'); });
});

/* ---------- calculator ---------- */
function renderCalc(app){
  app.innerHTML = '<h1>Reconstitution calculator</h1><div class="sub" style="margin-bottom:14px">Live math only — nothing here is saved. U-100 insulin syringe: 1 mL = 100 units.</div>' +
  '<div class="card"><div class="grid2"><div class="field"><label for="c-vial">Vial size (mg)</label><input id="c-vial" type="number" step="any" min="0" inputmode="decimal" placeholder="e.g. 10"></div>' +
  '<div class="field"><label for="c-water">Bacteriostatic water (mL)</label><input id="c-water" type="number" step="any" min="0" inputmode="decimal" placeholder="e.g. 2"></div></div>' +
  '<div class="out"><div><span>mg per mL</span><b id="o-mg">—</b></div><div><span>mcg per mL</span><b id="o-mcg">—</b></div><div><span>mcg per unit (U-100)</span><b id="o-unit">—</b></div></div>' +
  '<h3 style="margin-top:18px">Desired dose</h3><div class="grid2"><div class="field"><label for="c-dose">Dose</label><input id="c-dose" type="number" step="any" min="0" inputmode="decimal" placeholder="e.g. 250"></div>' +
  '<div class="field"><label for="c-dunit">Units</label><select id="c-dunit"><option>mcg</option><option>mg</option></select></div></div>' +
  '<div class="out"><div><span>Volume to draw</span><b id="o-ml">—</b></div><div><span>Syringe units (U-100)</span><b id="o-u">—</b></div><div><span>Doses per vial</span><b id="o-n">—</b></div></div>' +
  '<div class="hint" id="c-warn"></div></div>';
  function upd(){
    var v = num($('#c-vial').value), w = num($('#c-water').value), d = num($('#c-dose').value), u = $('#c-dunit').value;
    var c = v != null && v > 0 && w ? v / w : null;
    $('#o-mg').textContent = c ? fmtNum(c, 4) : '—';
    $('#o-mcg').textContent = c ? fmtNum(c * 1000, 2) : '—';
    $('#o-unit').textContent = c ? fmtNum(c * 1000 / 100, 2) : '—';
    var r = calcDraw(c, d, u);
    $('#o-ml').textContent = r ? fmtNum(r.ml, 3) + ' mL' : '—';
    $('#o-u').textContent = r ? fmtNum(r.units, 1) + ' units' : '—';
    var doseMg = d ? (u === 'mcg' ? d / 1000 : d) : null;
    $('#o-n').textContent = c && doseMg ? fmtNum(Math.floor(v / doseMg + 1e-9), 0) : '—';
    $('#c-warn').textContent = r && r.units > 100 ? 'Note: more than 100 units — exceeds a 1 mL U-100 syringe.' : r && r.units < 2 ? 'Note: under 2 units is hard to measure accurately; consider more water.' : '';
  }
  $all('#app input, #app select').forEach(function(el){ el.addEventListener('input', upd); el.addEventListener('change', upd); });
}

function convW(w, from, to){ if (w == null) return null; if (from === to) return w; return to === 'kg' ? w / 2.20462 : w * 2.20462; }

function getProg(id){ return state.data.progress.filter(function(e){ return e.id === id; })[0]; }
function deltaHTML(cur, prev){
  if (!prev) return '<span class="delta">First entry</span>';
  var bits = [];
  if (cur.weight != null && prev.weight != null) { var dw = cur.weight - convW(prev.weight, prev.unit, cur.unit); bits.push('<span class="' + (dw < 0 ? 'dn' : dw > 0 ? 'up' : '') + '">' + signed(dw, 1) + ' ' + cur.unit + '</span>'); }
  if (cur.bodyFat != null && prev.bodyFat != null) { var db = cur.bodyFat - prev.bodyFat; bits.push('<span class="' + (db < 0 ? 'dn' : db > 0 ? 'up' : '') + '">' + signed(db, 1) + ' BF pts</span>'); }
  var days = C.diffDays(prev.date, cur.date);
  return '<span class="delta">' + (bits.length ? bits.join(' · ') : 'No comparable values') + ' vs previous (' + days + 'd)</span>';
}

  '<select name="unit" aria-label="Weight unit" style="width:80px"><option value="lb"' + (unit === 'lb' ? ' selected' : '') + '>lb</option><option value="kg"' + (unit === 'kg' ? ' selected' : '') + '>kg</option></select></div></div>' +
  '<div class="field"><label for="pg-bf">Body fat % (optional)</label><input id="pg-bf" name="bodyFat" type="number" step="any" min="0" max="100" inputmode="decimal" value="' + (ed && ed.bodyFat != null ? ed.bodyFat : '') + '"></div></div>' +
  '<div class="grid2"><div class="field"><label for="pg-note">Notes (optional)</label><input id="pg-note" name="note" maxlength="500" value="' + esc(ed ? ed.note : '') + '"></div>' +

  if ($('#cmpBtn')) $('#cmpBtn').addEventListener('click', function(){
    if (state.compareSel.length !== 2) return;
    location.hash = '#/compare/' + encodeURIComponent(state.compareSel[0]) + '/' + encodeURIComponent(state.compareSel[1]);
  });
  if ($('#cmpClear')) $('#cmpClear').addEventListener('click', function(){ state.compareSel = []; render(); });
}

function renderCompare(app, aId, bId){
  var a = getProg(aId), b = getProg(bId);
  if (!a || !b || a === b) { app.innerHTML = '<a class="back" href="#/progress">← Progress</a><div class="empty"><b>Pick two entries to compare</b></div>'; return; }
  if (a.date > b.date || (a.date === b.date && a.createdAt > b.createdAt)) { var t = a; a = b; b = t; } // older on the left
  function side(e, label){
    var img = getImage(e.photoId);
    return '<div class="card" data-side="' + label + '">' + (img ? '<img src="' + img.full + '" alt="Progress photo ' + esc(e.date) + '">' : '<div class="noimg">No photo</div>') +
      '<h3>' + label + ' · ' + esc(fmtDate(e.date)) + '</h3><div>' + (e.weight != null ? fmtNum(e.weight, 1) + ' ' + e.unit : 'No weight') + ' · ' + (e.bodyFat != null ? fmtNum(e.bodyFat, 1) + '% BF' : 'No BF%') + '</div>' +
      (e.note ? '<div class="sub" style="white-space:pre-wrap">' + esc(e.note) + '</div>' : '') + '</div>';
  }
  var days = C.diffDays(a.date, b.date);
  var dw = a.weight != null && b.weight != null ? b.weight - convW(a.weight, a.unit, b.unit) : null;
  var dbf = a.bodyFat != null && b.bodyFat != null ? b.bodyFat - a.bodyFat : null;
  app.innerHTML = '<a class="back" href="#/progress">← Progress</a><h1>Compare</h1><div class="sub" style="margin-bottom:14px">' + esc(fmtDate(a.date)) + ' → ' + esc(fmtDate(b.date)) + '</div>' +
    '<div class="out" id="cmpDiff" style="margin-bottom:14px"><div><span>Days apart</span><b id="d-days">' + days + ' day' + (days === 1 ? '' : 's') + '</b></div>' +
    '<div><span>Weight change</span><b id="d-w">' + (dw != null ? signed(dw, 1) + ' ' + b.unit : '—') + '</b></div>' +
    '<div><span>Body fat change</span><b id="d-bf">' + (dbf != null ? signed(dbf, 1) + ' pts' : '—') + '</b></div></div>' +
    '<div class="cmp">' + side(a, 'Before') + side(b, 'After') + '</div>';
}

/* ---------- backup ---------- */
function renderData(app){
  var d = state.data, nImg = Object.keys(referencedImageIds(d)).length;
  app.innerHTML = '<h1>Backup</h1><div class="sub" style="margin-bottom:14px">Export and import act only on the active profile: <b>' + esc(profileName(state.profile)) + '</b>.</div>' +
  '<div class="card stack"><div>' + d.peptides.length + ' entries · ' + d.peptides.reduce(function(s, p){ return s + p.doses.length; }, 0) + ' doses · ' + d.progress.length + ' progress entries · ' + nImg + ' photos</div>' +
  '<div class="tools"><button class="btn primary" id="exportBtn" type="button">Export JSON</button><button class="btn" id="importBtn" type="button">Import JSON</button>' +
  '<button class="btn danger" id="clearBtn" type="button">Clear ' + esc(profileName(state.profile)) + '’s data</button></div>' +
  '<div class="hint">Export includes photos. Import replaces this profile’s current data (and photos) with the file’s contents after you confirm.</div></div>';
  $('#exportBtn').addEventListener('click', exportJSON);
  $('#importBtn').addEventListener('click', function(){ $('#importFile').value = ''; $('#importFile').click(); });
  $('#clearBtn').addEventListener('click', function(){
    if (!confirm('Delete ALL of ' + profileName(state.profile) + '’s entries, doses, progress, and photos? Export first if you want a backup.')) return;
    state.data = emptyProfileData(); saveProfile(); gcImages(state.profile, state.data); toast('Profile cleared'); render();
  });
}
function exportJSON(){
  var images = {};
  Object.keys(referencedImageIds(state.data)).forEach(function(id){ var im = getImage(id); if (im) images[id] = im; });
  var payload = {app: 'vesper', version: 2, profile: state.profile, exportedAt: new Date().toISOString(), data: state.data, images: images};
  var blob = new Blob([JSON.stringify(payload)], {type: 'application/json'});
  var a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'vesper-' + state.profile + '-' + todayISO() + '.json';
  document.body.appendChild(a); a.click();
  setTimeout(function(){ URL.revokeObjectURL(a.href); a.remove(); }, 1000);
  toast('Exported ' + profileName(state.profile) + '’s data');
}
$('#importFile').addEventListener('change', function(e){
  var file = e.target.files && e.target.files[0]; if (!file) return;
  var reader = new FileReader();
  reader.onload = function(){
    var obj, data, norm;
    try {
      obj = JSON.parse(reader.result); data = obj && obj.data ? obj.data : obj;
      if (!data || !Array.isArray(data.peptides)) throw new Error('No peptides array found');
      norm = normalize(data);
    } catch(err){ alert('Import failed: ' + err.message); return; }
    var images = obj && obj.images && typeof obj.images === 'object' ? obj.images : {};
    var from = obj.profile && obj.profile !== state.profile ? ' (file was exported from ' + profileName(obj.profile) + ')' : '';
    if (!confirm('Replace ' + profileName(state.profile) + '’s data with ' + norm.peptides.length + ' entries, ' + norm.progress.length + ' progress entries and ' + Object.keys(images).length + ' photos from this file' + from + '?')) return;
    var prof = state.profile, written = [], existing = {};
    profileImageIds(prof).forEach(function(id){ existing[id] = 1; });
    var ref = referencedImageIds(norm);
    for (var id in ref) {
      var im = images[id];
      if (!im || typeof im.full !== 'string' || !/^data:image\//.test(im.full)) { norm.peptides.forEach(function(p){ if (p.photoId === id) p.photoId = null; }); norm.progress.forEach(function(x){ if (x.photoId === id) x.photoId = null; }); continue; }
      try { localStorage.setItem(imgKey(prof, id), JSON.stringify({full: im.full, thumb: typeof im.thumb === 'string' ? im.thumb : im.full})); if (!existing[id]) written.push(id); }
      catch(err){ written.forEach(function(w){ removeImage(w, prof); }); alert(isQuota(err) ? STORAGE_FULL_MSG + ' Nothing was imported.' : 'Import failed while saving photos.'); return; }
    }
    var prevData = state.data; state.data = norm;
    if (!saveProfile()) { state.data = prevData; written.forEach(function(w){ removeImage(w, prof); }); return; }
    gcImages(prof, norm); state.compareSel = []; state.editingProgressId = null;
    toast('Import complete'); render();
  };
  reader.readAsText(file);
});

/* ---------- boot ---------- */
initProfiles();
render();
})();
</script>
<script>
if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol)) {
  window.addEventListener('load', function(){ navigator.serviceWorker.register('sw.js').catch(function(e){ console.warn('SW registration failed', e); }); });
}
</script>
